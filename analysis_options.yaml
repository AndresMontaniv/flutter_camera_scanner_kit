# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# For more information, see:
# https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  # Replaces the old `strong-mode: implicit-casts/implicit-dynamic` keys, which
  # were removed from the analyzer in Dart 2.19 and had been silently inert.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    todo: info
    dead_code: error

  # Only build output needs excluding — the analyzer does not walk the native
  # platform directories of a Dart package.
  exclude:
    - build/**
    - example/build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Only rules NOT already inherited from flutter_lints -> lints/recommended
    # -> lints/core. Anything already covered upstream is omitted so this list
    # states what the package actually adds.
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_relative_imports
    - cascade_invocations

    # Makes the unawaited() calls around feedback playback load-bearing rather
    # than stylistic, and catches the next accidentally-dropped future.
    - unawaited_futures

    # This package's dartdoc leans heavily on [Symbol] links; this catches ones
    # that broke in a rename and would render as dead text on pub.dev.
    - comment_references

    - directives_ordering
    - avoid_dynamic_calls

formatter:
  trailing_commas: preserve
