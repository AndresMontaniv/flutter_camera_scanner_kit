name: camera_scanner_kit
description: A production-grade Flutter UI toolkit for high-speed barcode scanning, featuring native haptics, zero-latency audio, and inline routing.
version: 1.1.6
repository: https://github.com/AndresMontaniv/flutter_camera_scanner_kit
topics:
  - scanner
  - barcode
  - pos
  - camera
  - qr

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.0
  native_haptics_and_audio: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

